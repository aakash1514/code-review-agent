name: deploy-web

# Builds the React dashboard and publishes it to S3 behind CloudFront.
# Runs when dashboard code lands on main, or by hand from the Actions tab.
# Same protection as deploy-app: approval in the `production` environment,
# short-lived AWS credentials through OIDC.
on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  id-token: write   # OIDC token for AWS
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and publish the dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Build
        working-directory: dashboard
        run: |
          npm ci
          npm run build

      - name: AWS credentials (OIDC -> cra-gha-deploy)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-deploy-web-${{ github.run_id }}

      # Vite puts a content hash in every asset name, so assets are cached for a
      # year; index.html is "no-cache" so a new deploy shows up immediately.
      # Assets go first, so the new index.html never points at missing files.
      - name: Upload to S3
        run: |
          aws s3 sync dashboard/dist "s3://${{ vars.S3_BUCKET }}" --delete --exclude index.html \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 cp dashboard/dist/index.html "s3://${{ vars.S3_BUCKET }}/index.html" \
            --cache-control "no-cache"

      - name: Invalidate index.html in CloudFront
        run: |
          ID=$(aws cloudfront create-invalidation --distribution-id "${{ vars.CF_DISTRIBUTION_ID }}" \
                 --paths "/" "/index.html" --query 'Invalidation.Id' --output text)
          echo "invalidation $ID"
          aws cloudfront wait invalidation-completed --distribution-id "${{ vars.CF_DISTRIBUTION_ID }}" --id "$ID"

      # The live page must reference the JS bundle we just built.
      - name: Smoke test the live dashboard
        run: |
          BUNDLE=$(grep -o 'assets/index-[A-Za-z0-9_-]*\.js' dashboard/dist/index.html | head -1)
          echo "expected bundle: $BUNDLE"
          curl -fsS --max-time 10 "${{ vars.PUBLIC_BASE_URL }}/" | grep -q "$BUNDLE" \
            || { echo "::error::live index.html doesn't reference $BUNDLE"; exit 1; }
          curl -fsS -o /dev/null --max-time 10 "${{ vars.PUBLIC_BASE_URL }}/$BUNDLE"
          echo "dashboard live with $BUNDLE"