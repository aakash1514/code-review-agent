name: ci

# Runs on every PR into main and on every push to main.
# No secrets and no AWS access: it only tests, lints, builds and scans.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same PR/branch cancels the older, still-running CI.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      # tests/conftest.py blocks outbound network, so no real LLM/GitHub/AWS calls.
      - name: pytest
        run: python -m pytest -q

  dashboard:
    name: Dashboard lint + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  image:
    name: Docker build + Trivy scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same flags as the real deploy: one plain image, no attestation manifests.
      - name: docker build
        run: docker build --provenance=false --sbom=false -t "code-review-agent:ci-${GITHUB_SHA}" .

      # Gate: fail on HIGH/CRITICAL vulnerabilities that have a fix available.
      # Unfixed base-image CVEs (deferred #9) are reported but don't block,
      # because there is nothing to upgrade to yet.
      - name: Trivy scan (HIGH/CRITICAL with a fix = fail)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: code-review-agent:ci-${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table